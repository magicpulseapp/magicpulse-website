name: Website checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate site
        run: npm run build

      - name: Compare release metadata with Apple
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check:release:remote
