<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Magic Pulse support for product questions, billing, and troubleshooting." />
  <title>Support | Magic Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <a href="index.html" class="brand">Magic Pulse</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html#product">Product</a>
        <a href="index.html#how">How it works</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#faq">FAQ</a>
        <a href="support.html">Support</a>
        <a href="index.html#download" class="btn btn-nav">Get App</a>
      </nav>
      <button class="menu-btn" type="button" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <p class="eyebrow">Support</p>
      <h1>Contact support</h1>
      <p class="section-copy">Submit product, account, or billing questions. Response target is 1-2 business days.</p>

      <section class="card" style="max-width: 700px;">
        <form id="support-form" action="https://formspree.io/f/xjgeljqp" method="POST">
          <input type="hidden" name="_subject" value="Magic Pulse Support Request" />

          <p class="section-copy" style="margin-top:0;">Please include enough detail for faster resolution.</p>

          <label class="eyebrow" for="name">Name</label>
          <input class="form-input" id="name" name="name" type="text" placeholder="Your name" required autocomplete="name" />

          <label class="eyebrow" for="email" style="margin-top:1rem;">Email</label>
          <input class="form-input" id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />

          <label class="eyebrow" for="topic" style="margin-top:1rem;">Topic</label>
          <select class="form-input form-select" id="topic" name="topic" required>
            <option value="">Choose a topic...</option>
            <option value="general">General question</option>
            <option value="bug">Bug report</option>
            <option value="feature">Feature request</option>
            <option value="billing">Billing / Pro</option>
            <option value="other">Other</option>
          </select>

          <label class="eyebrow" for="message" style="margin-top:1rem;">Message</label>
          <textarea class="form-input form-textarea" id="message" name="message" rows="6" placeholder="Describe your issue or request..." required></textarea>

          <div id="form-status" class="form-status" hidden aria-live="polite"></div>
          <div class="hero-actions" style="margin-top:1rem;">
            <button type="submit" class="btn btn-primary">Send message</button>
            <a class="btn btn-ghost" href="index.html#faq">View FAQ</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p class="brand">Magic Pulse</p>
      <p>
        <a href="privacy.html">Privacy Policy</a> ·
        <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" target="_blank" rel="noopener noreferrer">Terms</a> ·
        <a href="support.html">Support</a>
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    (function () {
      var form = document.getElementById('support-form');
      var status = document.getElementById('form-status');
      if (!form || !status) return;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var submit = form.querySelector('button[type="submit"]');
        if (!submit) return;
        submit.disabled = true;
        submit.textContent = 'Sending...';
        status.hidden = true;
        status.className = 'form-status';

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        })
          .then(function (res) {
            if (!res.ok) throw new Error('failed');
            status.textContent = 'Thanks. Your message has been sent.';
            status.className = 'form-status form-status--success';
            form.reset();
          })
          .catch(function () {
            status.textContent = 'Unable to send right now. Please try again.';
            status.className = 'form-status form-status--error';
          })
          .finally(function () {
            status.hidden = false;
            submit.disabled = false;
            submit.textContent = 'Send message';
          });
      });
    })();
  </script>
</body>
</html>
